name: CI — Palmcrest Hospital App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Tests (Jest) ───────────────────────────────────────────────────
  backend-tests:
    name: 🟢 Backend — Jest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test
        env:
          # Use a placeholder URI — mongoose is mocked in tests
          MONGO_URI: mongodb://localhost:27017/palmcrest_test
          NODE_ENV: test

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─── Frontend Tests (Vitest) ────────────────────────────────────────────────
  frontend-tests:
    name: 🔵 Frontend — Vitest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/
          retention-days: 7

  # ─── Summary job (required status check) ───────────────────────────────────
  all-tests-pass:
    name: ✅ All tests passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "❌ One or more test jobs failed."
            exit 1
          fi
          echo "✅ All tests passed!"
